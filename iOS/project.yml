# The Xcode project is made from this file with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   brew install xcodegen && xcodegen        (in this folder), then open LionFlow.xcodeproj
name: LionFlow
options:
  bundleIdPrefix: no.lionflow
  deploymentTarget:
    iOS: "15.0"
    watchOS: "8.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    # The app's identifier. Building with your own Apple ID? Change this one line to something of your own
    # (for example com.yourname.lionflow): the watch app's identifier follows it.
    LF_BUNDLE_ID: no.lionflow.app
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
targets:
  LionFlow:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Core
      - path: LionFlow
      - path: l10n-ios.tsv
        buildPhase: resources
      # The texts and the sign-in settings are the Android app's own files: one copy for both apps.
      - path: ../Android/app/src/main/assets/l10n.tsv
        buildPhase: resources
      - path: ../Android/app/src/main/assets/stellantis_configs.json
        buildPhase: resources
    info:
      path: LionFlow/Info.plist
      properties:
        CFBundleDisplayName: LionFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - mailto
        NSLocationWhenInUseUsageDescription: LionFlow shows where you are on the map, to find chargers near you and the way to your car. Your position is not sent to LionFlow or anyone else.
        NSFaceIDUsageDescription: LionFlow can ask for Face ID before it unlocks your car or opens the app.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LF_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
    dependencies:
      # The Apple Watch app travels inside the iPhone app.
      - target: LionFlowWatch

  # LionFlow on the Apple Watch. It has no sign-in of its own: it asks the iPhone app (see Core/WatchLink.swift).
  LionFlowWatch:
    type: application
    platform: watchOS
    deploymentTarget: "8.0"
    sources:
      - path: Watch
      # The watch's own logic: also part of the phone app's tests, so both ends are tested together.
      - path: Core/WatchWire.swift
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: LionFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(LF_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LF_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        SKIP_INSTALL: "YES"

  # A walk through the whole app in the simulator (see UITests/TourTests.swift). Not part of the app.
  LionFlowTour:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: UITests
    dependencies:
      - target: LionFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LF_BUNDLE_ID).tour
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: LionFlow
schemes:
  LionFlow:
    build:
      targets:
        LionFlow: all
    run:
      config: Debug
  LionFlowTour:
    build:
      targets:
        LionFlow: all
        LionFlowTour: [test]
    test:
      config: Debug
      targets:
        - LionFlowTour
  LionFlowWatch:
    build:
      targets:
        LionFlowWatch: all
    run:
      config: Debug
