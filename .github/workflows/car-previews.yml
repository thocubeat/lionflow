# Draws the Android Auto screens to pictures (several car screen sizes, split and full screen, dark and light)
# and pushes them to the "car-previews" branch, so the design can be looked at without a car.
name: Car screen pictures
on: workflow_dispatch
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      # Android's graphics for the tests are a big download: kept between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-34
      - name: Draw the screens
        # Tried twice: the download of Android's graphics for the test is sometimes refused the first time.
        working-directory: Android
        run: |
          gradle :app:testDebugUnitTest -PcarPreviews --tests 'no.lionflow.app.car.*' --no-daemon || { sleep 45; gradle :app:testDebugUnitTest -PcarPreviews --tests 'no.lionflow.app.car.*' --stacktrace --no-daemon; }
      - name: Push to the car-previews branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -r Android/app/build/car-previews /tmp/out/pictures 2>/dev/null || true
          cp -r Android/app/build/test-results/testDebugUnitTest /tmp/out/results 2>/dev/null || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan previews-tmp && git rm -rfq . && git clean -fdxq
          cp -r /tmp/out/* . 2>/dev/null || true
          date -u > when.txt && git add -A
          git commit -qm "Car screen pictures" && git push -f origin previews-tmp:car-previews
