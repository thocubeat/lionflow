# Runs the iPhone and iPad app on the oldest system the simulator can still get, and takes the same pictures as the
# main iOS workflow. The app is built for iOS 15 and newer (an iPhone 6s from 2015 runs iOS 15), but Apple no longer
# offers iOS 15 for the simulator: asked for in November 2026, Xcode 26.6 and Xcode 16.4 both answered "not available
# for download". iOS 16.0 is the oldest there is, so that is what this runs on (as an iPhone 8 and an iPad from 2017).
# The pictures go to the branch "ios-previews-old-ios16-macos-26".
# The old system has to be downloaded first (several GB), so this runs by hand, or when this file changes.
name: iOS on old systems

on:
  workflow_dispatch:
  push:
    branches: [ main, ios ]
    paths: [ ".github/workflows/ios-old.yml" ]

permissions:
  contents: write

concurrency:
  group: ios-old-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: iOS
    steps:
      - uses: actions/checkout@v4

      - name: Build for the simulator
        run: |
          xcodebuild -version
          which xcodegen || brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild -project LionFlow.xcodeproj -scheme LionFlow -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sim.log || { grep -E "error" sim.log | sort -u | head -80; exit 1; }
          # The watch app inside is for another kind of simulator: it stays out of this.
          rm -rf build-sim/Build/Products/Debug-iphonesimulator/LionFlow.app/Watch
          ditto -c -k --keepParent build-sim/Build/Products/Debug-iphonesimulator/LionFlow.app LionFlow-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LionFlow-simulator
          path: iOS/LionFlow-simulator.zip
          retention-days: 3

  old:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # iOS 15 is asked for first, in case it is offered again one day.
          - machine: macos-26
            versions: "15.0 15.5 16.0 16.1 16.2 16.4"
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: LionFlow-simulator

      - name: What this machine has
        run: |
          xcodebuild -version
          unzip -q LionFlow-simulator.zip && ls -d LionFlow.app
          echo "--- systems installed for the simulator"
          xcrun simctl list runtimes
          echo "--- old devices it knows"
          xcrun simctl list devicetypes | grep -E "iPhone (6s|7|8|SE)|iPad (Air 2|mini 4|\(5th|\(6th|Pro \(9)" || true

      - name: Get an old iOS for the simulator
        run: |
          for version in ${{ matrix.versions }}; do
            if xcrun simctl list runtimes | grep -q "iOS $version"; then echo "iOS $version is already here"; echo "OLD_IOS=$version" >> "$GITHUB_ENV"; break; fi
            echo "asking for iOS $version"
            perl -e 'alarm shift; exec @ARGV' 2400 xcodebuild -downloadPlatform iOS -buildVersion "$version" 2>&1 | grep -v -E "^Downloading .*%|^Installing .*%" | tail -n 4
            if xcrun simctl list runtimes | grep -q "iOS $version"; then echo "got iOS $version"; echo "OLD_IOS=$version" >> "$GITHUB_ENV"; break; fi
          done
          xcrun simctl list runtimes

      - name: Make an old iPhone and an old iPad
        run: |
          [ -n "${OLD_IOS:-}" ] || { echo "No old iOS could be downloaded on this machine: nothing to run the app on."; exit 1; }
          runtime="$(xcrun simctl list runtimes | grep "iOS $OLD_IOS" | sed -E 's/.* (com\.apple\.CoreSimulator\.SimRuntime\.[A-Za-z0-9.-]+).*/\1/' | head -n 1)"
          echo "system: $runtime"
          make() { # name, device types to try, oldest first
            local name="$1"; shift
            for type in "$@"; do
              if udid="$(xcrun simctl create "$name" "$type" "$runtime" 2>/dev/null)"; then echo "$name: $type ($udid)" >&2; echo "$udid"; return 0; fi
            done
            echo "$name: no device of this kind runs iOS $OLD_IOS here" >&2
          }
          echo "PHONE_UDID=$(make old-phone 'iPhone 6s' 'iPhone SE (1st generation)' 'iPhone 7' 'iPhone 8' 'iPhone SE (2nd generation)' 'iPhone 11')" >> "$GITHUB_ENV"
          echo "PAD_UDID=$(make old-pad 'iPad Air 2' 'iPad mini 4' 'iPad (5th generation)' 'iPad (6th generation)' 'iPad Pro (9.7-inch)' 'iPad (9th generation)')" >> "$GITHUB_ENV"

      - name: Take pictures on the old system
        env:
          SKIP_WATCH: "1"
        run: |
          [ -n "${PHONE_UDID:-}${PAD_UDID:-}" ] || { echo "no old device to run on"; exit 1; }
          .github/scripts/ios-screenshots.sh "$PWD/LionFlow.app" "$PWD/shots"
          # A crash would leave a report behind: there should be none.
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i lionflow || echo "no crash reports"

      - name: Publish the pictures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] && [ -n "$(ls shots 2>/dev/null)" ] || { echo "no pictures"; exit 0; }
          branch="ios-previews-old-ios${OLD_IOS%%.*}-${{ matrix.machine }}"
          work="$RUNNER_TEMP/previews"
          rm -rf "$work" && mkdir -p "$work" && cp shots/*.png "$work/"
          echo "Pictures of commit ${GITHUB_SHA} (${GITHUB_REF_NAME}) on iOS ${OLD_IOS:-?} ($(xcodebuild -version | head -n 1) on ${{ matrix.machine }}), made by the workflow \"iOS on old systems\"." > "$work/README.md"
          cd "$work"
          git init -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pictures of ${GITHUB_SHA} on iOS ${OLD_IOS:-?}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          # The first version of this workflow used another branch name: that branch is not needed any more.
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/ios-previews-ios15" > /dev/null 2>&1 || true
