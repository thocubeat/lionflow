# Builds LionFlow for iPhone and iPad: tests the car logic, builds the app, takes pictures of it in the simulator,
# and puts the unsigned app (LionFlow.ipa) where people can download it.
name: iOS

on:
  push:
    branches: [ main, ios ]
    paths: [ "iOS/**", ".github/workflows/ios.yml", ".github/scripts/ios-*", "Android/app/src/main/assets/**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: iOS
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          xcodebuild -version
          swift --version
          which xcodegen || brew install xcodegen
          xcodegen --version
          xcodebuild -showsdks | grep -i -E "iphone|watch" || true

      # A message server on this machine, so the remote-control tests can send commands through a real one.
      - name: Start a local MQTT server
        run: |
          brew install mosquitto > /dev/null 2>&1 || brew install mosquitto
          "$(brew --prefix mosquitto)/sbin/mosquitto" -p 18830 -d
          sleep 1
          nc -z 127.0.0.1 18830 && echo "MQTT server is up"

      # The logic is checked against the Android app's own answers (iOS/CoreTests/Fixtures, made by iOS/oracle).
      - name: Test the car logic
        env:
          LIONFLOW_MQTT_TEST: "1"
        run: |
          set +e
          swift test > test.log 2>&1
          status=$?
          grep -E "error:|Executed [0-9]+ tests|Test Suite '.*' (passed|failed)" test.log | cut -c1-700 | head -200
          tail -n 5 test.log
          exit $status

      # The simulator pictures use a sample car, so they never talk to the carmaker. This asks the real servers for
      # their greeting, under the rules iOS sets for encrypted connections.
      - name: Check that an iPhone can reach the servers
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ../.github/scripts/ios-servers.sh

      # An icon name the oldest supported system doesn't know would show as an empty space: checked here.
      - name: Check that every icon exists on iOS 15
        if: ${{ !cancelled() }}
        run: python3 ../.github/scripts/ios-symbols.py .

      # The steps below also run when a test above failed: one run then shows everything that is wrong.
      - name: Make the Xcode project
        if: ${{ !cancelled() }}
        run: xcodegen generate

      # Each build gets a version of its own: the major and minor number from project.yml, then this run's number
      # ("0.1.57"). SideStore only offers an update when that version is higher than the one installed.
      - name: Version of this build
        if: ${{ !cancelled() }}
        run: |
          base="$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([0-9]+)\.([0-9]+).*/\1.\2/')"
          echo "IOS_VERSION=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "this build: ${base}.${GITHUB_RUN_NUMBER} (${GITHUB_RUN_NUMBER})"

      # The iPhone/iPad app, with the Apple Watch app inside it. Not signed: whoever installs it signs it with
      # their own Apple ID (see the README).
      - name: Build for iPhone, iPad and Apple Watch (unsigned)
        id: device
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild -project LionFlow.xcodeproj -scheme LionFlow -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" MARKETING_VERSION="$IOS_VERSION" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error" build.log | sort -u | head -150; exit 1; }
          # Would Xcode rather have a newer oldest-supported system than the one asked for?
          grep -E "deployment target|DEPLOYMENT_TARGET" build.log | grep -i -E "warning|range" | sort -u | head -10 || true
          app=build/Build/Products/Release-iphoneos/LionFlow.app
          echo "version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist"))"
          echo "oldest iOS it runs on: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")"
          echo "iPhone app is built for: $(lipo -archs "$app/LionFlow")"
          ls "$app/Watch" && watch="$app/Watch/LionFlowWatch.app" && \
            echo "oldest watchOS it runs on: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$watch/Info.plist")" && \
            echo "watch app is built for: $(lipo -archs "$watch/LionFlowWatch")"

      # Two files. LionFlow.ipa is the iPhone and iPad app on its own: the one to install with SideStore, AltStore
      # or Sideloadly. LionFlow-with-Watch.ipa also has the Apple Watch app inside, which those tools cannot install
      # with a free Apple ID (it is there for Xcode-less tools that can).
      - name: Pack LionFlow.ipa
        if: ${{ !cancelled() && steps.device.outcome == 'success' }}
        run: |
          app=build/Build/Products/Release-iphoneos/LionFlow.app
          test -d "$app/Watch/LionFlowWatch.app"
          test -d "$app/PlugIns/LionFlowWidget.appex"
          # Signed "ad hoc" (no Apple ID) only so the files carry their entitlements: the App Group that the app and
          # its widget share. SideStore and AltStore read them and set the group up when they sign it for real.
          id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>com.apple.security.application-groups</key><array><string>group.%s</string></array></dict></plist>\n' "$id" > group.entitlements
          sign() { codesign --force --sign - --timestamp=none "$@"; }
          rm -rf Payload && mkdir Payload && cp -R "$app" Payload/
          sign Payload/LionFlow.app/Watch/LionFlowWatch.app
          sign --entitlements group.entitlements Payload/LionFlow.app/PlugIns/LionFlowWidget.appex
          sign --entitlements group.entitlements Payload/LionFlow.app
          zip -qry LionFlow-with-Watch.ipa Payload
          rm -rf Payload/LionFlow.app/Watch
          sign --entitlements group.entitlements Payload/LionFlow.app
          codesign -d --entitlements :- Payload/LionFlow.app/PlugIns/LionFlowWidget.appex | grep -q "group.$id"
          zip -qry LionFlow.ipa Payload
          # The same file under its version's name: the source points at this one, so what SideStore downloads is
          # always the build the source describes, also while a newer one is being uploaded.
          cp LionFlow.ipa "LionFlow-${IOS_VERSION}.ipa"
          ls -lh LionFlow*.ipa
          unzip -l LionFlow.ipa | grep -c "Watch/" | grep -qx 0
          python3 ../.github/scripts/ios-source.py "LionFlow-${IOS_VERSION}.ipa" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-latest/LionFlow-${IOS_VERSION}.ipa" \
            "$(git log -1 --format=%s)" source.json

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.device.outcome == 'success' }}
        with:
          name: LionFlow-ipa
          path: |
            iOS/LionFlow.ipa
            iOS/LionFlow-with-Watch.ipa
            iOS/source.json

      # Where people download it: one page that always has the newest build. It is a pre-release with a tag of its
      # own, so the Android app's updater and the "latest version" link never see it.
      - name: Publish LionFlow.ipa
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plist=build/Build/Products/Release-iphoneos/LionFlow.app/Info.plist
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist"))"
          {
            echo "LionFlow for iPhone and iPad, version ${version}, built $(date -u +%Y-%m-%d) from ${GITHUB_SHA:0:7}."
            echo
            echo "**A preview.** It is tested by programs and in the simulator, not yet on a real iPhone with a real car."
            echo
            echo "- \`LionFlow.ipa\`: the iPhone and iPad app. This is the one to install with Sideloadly, SideStore or AltStore."
            echo "- \`LionFlow-with-Watch.ipa\`: the same app with the Apple Watch app inside. Those tools can't install a watch app with a free Apple ID; the watch app is easiest to get by building with Xcode."
            echo "- \`source.json\`: add this address as a source in SideStore or AltStore, and they tell you about every new build and install it over the one you have:"
            echo "  https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-latest/source.json"
            echo
            echo "How to install, and how to keep it working by itself: https://github.com/${GITHUB_REPOSITORY}#install-on-iphone-or-ipad-outside-the-app-store"
          } > notes.md
          if gh release view ios-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit ios-latest --repo "$GITHUB_REPOSITORY" --prerelease --title "LionFlow for iPhone and iPad (preview)" --notes-file notes.md
          else
            gh release create ios-latest --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "LionFlow for iPhone and iPad (preview)" --notes-file notes.md
          fi
          # The app files first, the source last: the source must never point at a file that isn't there yet.
          gh release upload ios-latest --repo "$GITHUB_REPOSITORY" LionFlow.ipa LionFlow-with-Watch.ipa "LionFlow-${IOS_VERSION}.ipa" --clobber
          gh release upload ios-latest --repo "$GITHUB_REPOSITORY" source.json --clobber
          # The files of older versions go, apart from the last three (someone may be in the middle of installing one).
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/ios-latest" --jq '.assets[] | select(.name | test("^LionFlow-[0-9]+\\.[0-9]+\\.[0-9]+\\.ipa$")) | "\(.created_at) \(.id) \(.name)"' \
            | sort -r | tail -n +4 | while read -r _ id name; do
              echo "removing $name"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" || true
            done

      # Pictures of the app in demo mode, so every change can be looked at without a Mac. They go to the branch
      # "ios-previews" (not part of the app).
      - name: Build for the simulator
        id: simulator
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild -project LionFlow.xcodeproj -scheme LionFlow -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sim.log || { grep -E "error" sim.log | sort -u | head -80; exit 1; }

      - name: Take pictures in the simulator
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        env:
          # The iPad is looked at by the walk-through job below.
          SKIP_PAD: "1"
        run: |
          ../.github/scripts/ios-screenshots.sh "$PWD/build-sim/Build/Products/Debug-iphonesimulator/LionFlow.app" "$PWD/shots" \
            "$PWD/build-sim/Build/Products/Debug-watchsimulator/LionFlowWatch.app"

      - name: Publish the pictures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] && [ -n "$(ls shots 2>/dev/null)" ] || { echo "no pictures"; exit 0; }
          work="$RUNNER_TEMP/previews"
          rm -rf "$work" && mkdir -p "$work" && cp shots/*.png "$work/"
          echo "Pictures of commit ${GITHUB_SHA} (${GITHUB_REF_NAME}), made by the iOS workflow." > "$work/README.md"
          cd "$work"
          git init -q -b ios-previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pictures of ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-previews

  # A walk through the whole app in the simulator, tapping and scrolling the way a person would: every tab from top
  # to bottom, the sheets and editors, commands to the sample car, the first screens. It fails when a screen doesn't
  # open or the app stops, and its pictures go to the branch "ios-previews-tour".
  tour:
    runs-on: macos-26
    timeout-minutes: 95
    defaults:
      run:
        working-directory: iOS
    steps:
      - uses: actions/checkout@v4

      - name: Make the Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build the app and the walk-through
        id: tourbuild
        run: |
          device="$(xcrun simctl list devices available | grep -E "^[[:space:]]+iPhone" | grep -v -E "mini| SE " | tail -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          echo "simulator: $(xcrun simctl list devices available | grep "$device" | sed -E 's/^[[:space:]]+//')"
          echo "TOUR_DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" > /dev/null 2>&1 || true
          pad="$(xcrun simctl list devices available | grep -E "^[[:space:]]+iPad" | grep -v "mini" | tail -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          echo "and: $(xcrun simctl list devices available | grep "$pad" | sed -E 's/^[[:space:]]+//')"
          echo "TOUR_PAD=$pad" >> "$GITHUB_ENV"
          set -o pipefail
          xcodebuild build-for-testing -project LionFlow.xcodeproj -scheme LionFlowTour -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-tour ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee tour-build.log | grep -E "error:|\*\* TEST BUILD (SUCCEEDED|FAILED)" || true
          grep -q "TEST BUILD SUCCEEDED" tour-build.log || { grep -E -A 30 "error" tour-build.log | head -120; exit 1; }

      - name: Walk through the app
        run: |
          perl -e 'alarm shift; exec @ARGV' 600 xcrun simctl bootstatus "$TOUR_DEVICE" > /dev/null 2>&1 || echo "the simulator took long to start"
          # The map may ask where the phone is: answered in advance, so the question doesn't stand in the way.
          xcrun simctl install "$TOUR_DEVICE" build-tour/Build/Products/Debug-iphonesimulator/LionFlow.app
          xcrun simctl privacy "$TOUR_DEVICE" grant location no.lionflow.app || true
          xcrun simctl status_bar "$TOUR_DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          # The first start of the app on a freshly started simulator can take longer than the test waits for
          # ("Timed out while launching application"): it is started once here, until it opens.
          for try in 1 2 3 4; do
            perl -e 'alarm shift; exec @ARGV' 90 xcrun simctl launch "$TOUR_DEVICE" no.lionflow.app -signedout > /dev/null 2>&1 && break
            echo "the app did not start yet (try $try)"; sleep 15
          done
          sleep 5; xcrun simctl terminate "$TOUR_DEVICE" no.lionflow.app > /dev/null 2>&1 || true
          mkdir -p tour
          set +e
          # A test that hangs is stopped after a quarter of an hour, and the ones after it still run.
          TEST_RUNNER_TOUR_OUT="$PWD/tour" perl -e 'alarm shift; exec @ARGV' 2400 xcodebuild test-without-building -project LionFlow.xcodeproj -scheme LionFlowTour \
            -destination "platform=iOS Simulator,id=$TOUR_DEVICE" -destination-timeout 180 -derivedDataPath build-tour \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 900 -maximum-test-execution-time-allowance 900 \
            -retry-tests-on-failure -test-iterations 2 \
            -skip-testing:LionFlowTour/TourTests/test11ThePullCircle > tour.log 2>&1
          status=$?
          grep -E "Test Case .*(passed|failed)|error:|XCTAssert|Executed [0-9]+ tests|\*\* TEST|LionFlow tour: " tour.log | cut -c1-500 | head -150
          # When the test could not start at all, say why, and which simulators this walk-through can run on.
          if ! grep -q "Executed [0-9]* tests" tour.log; then
            grep -E -A 30 "error" tour.log | head -80
            xcodebuild -project LionFlow.xcodeproj -scheme LionFlowTour -showdestinations 2>&1 | head -60
          fi
          ls tour | wc -l
          exit $status

      # A picture of the small circle that comes down while a page is pulled. It has to be taken while a finger is
      # held down, which the test does from the side: good to have, but never a reason for this job to fail.
      - name: A picture of the pull circle
        if: ${{ !cancelled() && steps.tourbuild.outcome == 'success' }}
        continue-on-error: true
        run: |
          TEST_RUNNER_TOUR_OUT="$PWD/tour" perl -e 'alarm shift; exec @ARGV' 420 xcodebuild test-without-building -project LionFlow.xcodeproj -scheme LionFlowTour \
            -destination "platform=iOS Simulator,id=$TOUR_DEVICE" -destination-timeout 180 -derivedDataPath build-tour \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 240 \
            -only-testing:LionFlowTour/TourTests/test11ThePullCircle > tour-circle.log 2>&1 || echo "no picture of the pull circle this time"
          grep -E "Test Case .*(passed|failed)|error:|Executed [0-9]+ tests" tour-circle.log | cut -c1-300 | head -20
          ls tour | grep -c "pull-circle" || true

      # The same pages and sheets on an iPad, where the screens are laid out differently.
      - name: Walk through the app on an iPad
        if: ${{ !cancelled() && steps.tourbuild.outcome == 'success' }}
        run: |
          # One simulator at a time: two make the machine too slow for a test that waits for things to appear.
          xcrun simctl shutdown "$TOUR_DEVICE" > /dev/null 2>&1 || true
          xcrun simctl boot "$TOUR_PAD" > /dev/null 2>&1 || true
          perl -e 'alarm shift; exec @ARGV' 600 xcrun simctl bootstatus "$TOUR_PAD" > /dev/null 2>&1 || echo "the simulator took long to start"
          xcrun simctl install "$TOUR_PAD" build-tour/Build/Products/Debug-iphonesimulator/LionFlow.app
          xcrun simctl privacy "$TOUR_PAD" grant location no.lionflow.app || true
          xcrun simctl status_bar "$TOUR_PAD" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          # The first start of the app on a freshly started simulator can take longer than the test waits for
          # ("Timed out while launching application"): it is started once here, until it opens.
          for try in 1 2 3 4; do
            perl -e 'alarm shift; exec @ARGV' 90 xcrun simctl launch "$TOUR_PAD" no.lionflow.app -signedout > /dev/null 2>&1 && break
            echo "the app did not start yet (try $try)"; sleep 15
          done
          sleep 5; xcrun simctl terminate "$TOUR_PAD" no.lionflow.app > /dev/null 2>&1 || true
          mkdir -p tour-pad
          set +e
          # A test that fails is run once more: a simulator on a busy machine sometimes doesn't start the app in time.
          # A real fault fails both times.
          TEST_RUNNER_TOUR_OUT="$PWD/tour-pad" perl -e 'alarm shift; exec @ARGV' 1800 xcodebuild test-without-building -project LionFlow.xcodeproj -scheme LionFlowTour \
            -destination "platform=iOS Simulator,id=$TOUR_PAD" -destination-timeout 180 -derivedDataPath build-tour \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 900 -maximum-test-execution-time-allowance 900 \
            -only-testing:LionFlowTour/TourTests/test01EveryTabOfTheElectricCar -only-testing:LionFlowTour/TourTests/test03CommandsChangeTheSampleCar \
            -only-testing:LionFlowTour/TourTests/test04SheetsAndEditorsOpen -only-testing:LionFlowTour/TourTests/test08NothingShowsThroughTheClock \
            -only-testing:LionFlowTour/TourTests/test09PullingHomeDownReadsTheCarAgain -only-testing:LionFlowTour/TourTests/test12UpdateAndSignatureNotes \
            > tour-pad.log 2>&1
          status=$?
          grep -E "Test Case .*(passed|failed)|error:|XCTAssert|Executed [0-9]+ tests|\*\* TEST|LionFlow tour: " tour-pad.log | cut -c1-500 | head -80
          for f in tour-pad/*.png; do [ -f "$f" ] && mv "$f" "tour/pad-$(basename "$f")"; done
          cat tour-pad.log >> tour.log
          exit $status

      - name: Publish the pictures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d tour ] && [ -n "$(ls tour 2>/dev/null)" ] || { echo "no pictures"; exit 0; }
          for f in tour/*.png; do sips -Z 1400 "$f" > /dev/null 2>&1; done
          work="$RUNNER_TEMP/tour"
          rm -rf "$work" && mkdir -p "$work" && cp tour/*.png "$work/"
          grep -E "Test Case .*(passed|failed)|: error: |Executed [0-9]+ tests" tour.log | cut -c1-500 > "$work/result.txt" 2>/dev/null || true
          # What the walk-through wrote down along the way (on the iPhone, then on the iPad).
          cat tour/notes.txt tour-pad/notes.txt >> "$work/result.txt" 2>/dev/null || true
          echo "A walk through the app at commit ${GITHUB_SHA} (${GITHUB_REF_NAME}), made by the iOS workflow. result.txt says how it went." > "$work/README.md"
          cd "$work"
          git init -q -b ios-previews-tour
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "A walk through the app at ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-previews-tour
