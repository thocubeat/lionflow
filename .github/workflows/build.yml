name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ "README.md", "PRIVACY.md" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key from GitHub Secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK and Play bundle
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon


      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk LionFlow-1.0.${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk LionFlow.apk
          cp app/build/outputs/bundle/release/app-release.aab LionFlow-1.0.${{ github.run_number }}.aab

      - name: Show signing certificate fingerprint (public, for developer registration)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$SIGNING_STORE_PASSWORD" | grep -E "SHA256:" || true

      # Start the app on an emulator before releasing, so a build that crashes on launch never ships.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Smoke test (app must start without crashing)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r LionFlow.apk
            adb logcat -c
            adb shell am start -W -n no.lionflow.app/.MainActivity
            sleep 15
            adb logcat -d -v brief AndroidRuntime:E '*:S' > crash.txt || true
            if grep -q "Process: no.lionflow.app" crash.txt || ! adb shell pidof no.lionflow.app; then cat crash.txt; echo "::error::LionFlow crashed on launch"; exit 1; fi
            echo "App started fine"

      - uses: actions/upload-artifact@v4
        with:
          name: LionFlow-apk
          path: LionFlow.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LionFlow 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            LionFlow-*.apk
            LionFlow.apk
            LionFlow-*.aab
          make_latest: true

      # Google Play internal testing: installs from Play are trusted by Android Auto.
      # Runs only when the PLAY_SERVICE_ACCOUNT_JSON secret exists. The very first upload must be done by hand in Play Console.
      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY_KEY == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: no.lionflow.app
          releaseFiles: LionFlow-1.0.${{ github.run_number }}.aab
          releaseName: "1.0.${{ github.run_number }}"
          track: internal
          status: completed

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
