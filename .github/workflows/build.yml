name: Build APK

on:
  push:
    branches: [ main ]
    # Only the Android app releases from here. The iPhone app lives in iOS/ and has its own workflow.
    paths: [ "Android/**", ".github/workflows/build.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key from GitHub Secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Version shown to users: 1.1.0 was build 47; every build after that counts up the last number.
      - name: Version number
        run: |
          # Run 131 was 1.1.93. After 1.1.99 comes 1.2.00, 1.2.01 ... (and 1.3.00 after 1.2.99).
          n=$(( ${{ github.run_number }} - 38 ))
          echo "APP_VERSION_NAME=1.$(( 1 + n / 100 )).$(printf '%02d' $(( n % 100 )))" >> "$GITHUB_ENV"

      - name: Build signed release APK and Play bundle
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NOBIL_API_KEY: ${{ secrets.NOBIL_API_KEY }}
        run: |
          gradle :app:assembleRelease :wear:assembleRelease --stacktrace --no-daemon
          # The Play bundle is built separately, without the GitHub self-updater's permissions.
          gradle :app:bundleRelease -Pplay=true --stacktrace --no-daemon


      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "LionFlow-$APP_VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk LionFlow.apk
          cp app/build/outputs/bundle/release/app-release.aab "LionFlow-$APP_VERSION_NAME.aab"
          cp wear/build/outputs/apk/release/wear-release.apk "Watch-LionFlow-$APP_VERSION_NAME.apk"

      - name: Show signing certificate fingerprint (public, for developer registration)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$SIGNING_STORE_PASSWORD" | grep -E "SHA256:" || true

      # Start the app on an emulator before releasing, so a build that crashes on launch never ships.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Smoke test (app must start without crashing)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: Android
          script: |
            adb install -r LionFlow.apk
            adb logcat -c
            adb shell am start -W -n no.lionflow.app/.MainActivity
            sleep 15
            adb logcat -d -v brief AndroidRuntime:E '*:S' > crash.txt || true
            if grep -q "Process: no.lionflow.app" crash.txt || ! adb shell pidof no.lionflow.app; then cat crash.txt; echo "::error::LionFlow crashed on launch"; exit 1; fi
            echo "App started fine"

      - uses: actions/upload-artifact@v4
        with:
          name: LionFlow-apk
          path: Android/LionFlow.apk

      # Release notes = the commit message, without trailer lines (Co-Authored-By, sessions, etc.)
      - name: Release notes
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          [ -n "$MSG" ] || MSG="$(git log -1 --format=%B)"
          printf '%s\n' "$MSG" | grep -viE '^(co-authored-by|claude-session|signed-off-by):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md

      # Tiny file the GitHub installs fetch once a day; GitHub's download counter for it is the "active devices" badge.
      - name: Ping file
        run: echo ok > ping.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}.${{ github.run_number }}
          name: LionFlow ${{ env.APP_VERSION_NAME }}
          body_path: Android/notes.md
          files: |
            Android/LionFlow-*.apk
            Android/LionFlow.apk
            Android/LionFlow-*.aab
            Android/Watch-LionFlow-*.apk
            Android/ping.txt
          make_latest: true

      # Google Play internal testing (no review, instant). Promote to the closed test in Play Console when wanted.
      # Runs only when the PLAY_SERVICE_ACCOUNT_JSON secret exists. The very first upload must be done by hand in Play Console.
      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY_KEY == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: no.lionflow.app
          releaseFiles: Android/LionFlow-${{ env.APP_VERSION_NAME }}.aab
          releaseName: "${{ env.APP_VERSION_NAME }}"
          track: internal
          status: completed

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
