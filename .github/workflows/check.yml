name: Compile check

on:
  push:
    branches-ignore: [ main, stats ]
    paths: [ "Android/**", ".github/workflows/check.yml" ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK (no signing secrets needed)
        run: gradle :app:assembleDebug :wear:assembleDebug --stacktrace --no-daemon
      # The logic tests that need no phone (the car's status, the lock state after a command, mild hybrids).
      - name: Test the car logic
        run: gradle :app:testDebugUnitTest --tests 'no.lionflow.app.model.*' --stacktrace --no-daemon
