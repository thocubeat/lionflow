name: One-time cleanup of old releases

on:
  push:
    branches: [ main ]
    paths: [ ".github/workflows/cleanup-old-history.yml" ]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and tags from the old history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for t in v1.0.1 v1.0.10 v1.0.11 v1.0.12 v1.0.13 v1.0.14 v1.0.16 v1.0.2 v1.0.4 v1.0.5 v1.0.6 v1.0.7 v1.0.8 v1.0.9 ; do
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || true
          done
