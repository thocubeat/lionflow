# Takes Google Play screenshots of demo mode on an emulator (phone 1080x1920, tablets) and pushes them to the "store" branch.
name: Store screenshots
on: workflow_dispatch
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build
        env: { NOBIL_API_KEY: "${{ secrets.NOBIL_API_KEY }}" }
        working-directory: Android
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/shots.sh
      - name: Push to store branch
        run: |
          mkdir -p /tmp/out && cp -r shots /tmp/out/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan store-tmp && git rm -rfq . && cp -r /tmp/out/shots . && git add shots
          git commit -qm "Store screenshots" && git push -f origin store-tmp:store
